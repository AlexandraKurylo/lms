        topics:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonOutline'
        streams:
          type: array
          items:
            $ref: '#/components/schemas/StreamInfo'
    Material:
      type: object
      required:
        - id
        - title
        - kind
        - url
      properties:
        id:
          type: integer
        title:
          type: string
        kind:
          type: string
          enum:
            - video
            - article
            - file
            - link
        url:
          type: string
    IntroLesson:
      type: object
      required:
        - id
        - position
        - title
        - content
        - materials
      properties:
        id:
          type: integer
        position:
          type: integer
        title:
          type: string
        content:
          type: string
        materials:
          type: array
          items:
            $ref: '#/components/schemas/Material'
  parameters:
    CourseId:
      name: id
      in: path
      required: true
      description: Ідентифікатор курсу.
      schema:
        type: integer
        minimum: 1