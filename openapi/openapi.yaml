            $ref: '#/components/schemas/CourseSummary'
        nextCursor:
          type:
            - string
            - 'null'
          description: Курсор наступної сторінки; `null` на останній сторінці.
    TeacherProfile:
      type: object
      required:
        - id
        - name
        - bio
      properties:
        id:
          type: integer
        name:
          type: string
        bio:
          type:
            - string
            - 'null'
    LessonOutline:
      type: object
      required:
        - id
        - position
        - title
        - isFreeIntro
        - hasHomework
      properties:
        id:
          type: integer
        position:
          type: integer
          minimum: 1
        title:
          type: string
        isFreeIntro:
          type: boolean
        hasHomework:
          type: boolean
    StreamInfo:
      type: object
      required:
        - id
        - title
        - startsOn
        - endsOn
        - capacity
        - seatsTaken
        - seatsLeft
        - phase
      properties:
        id:
          type: integer
        title:
          type: string
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        capacity:
          type: integer
          minimum: 1
        seatsTaken:
          type: integer
          minimum: 0
