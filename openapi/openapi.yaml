  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Ключ ідемпотентності (1–255 видимих ASCII-символів без пробілів); діє 24 години для користувача.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[\x21-\x7e]+$'
    LessonId:
      name: id
      in: path
      required: true
      description: Ідентифікатор уроку.
      schema:
        type: integer
        minimum: 1
    CourseId:
      name: id
      in: path
      required: true
      description: Ідентифікатор курсу.
      schema:
        type: integer
        minimum: 1
    StreamId:
      name: id
      in: path
      required: true
      description: Ідентифікатор потоку.
      schema:
        type: integer
        minimum: 1
