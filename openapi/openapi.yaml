        Помилки 409: `stream-full` (місць немає), `stream-closed` (потік завершився),
        `already-enrolled` (студент уже записаний на цей курс).

        Заголовок `Idempotency-Key` необов'язковий (ADR 0014). З ним повтор того самого запиту
        повертає збережену відповідь із заголовком `Idempotency-Replayed: true` і не створює другий запис;
        той самий ключ з іншим запитом дає 422 `idempotency-key-reuse`. Ключ діє 24 години,
        помилки під ключем не зберігаються.
