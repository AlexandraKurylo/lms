        seatsLeft:
          type: integer
          minimum: 0
        phase:
          type: string
          enum:
            - upcoming
            - running
            - finished
    CoursePage:
      type: object
      required:
        - id
        - title
        - description
        - level
        - language
        - status
        - sequentialLessons
        - teacher
        - topics
        - lessons
        - streams
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        level:
          $ref: '#/components/schemas/Level'
        language:
          type: string
        status:
          type: string
          enum:
            - draft
            - published
        sequentialLessons:
          type: boolean
          description: Якщо `true`, наступний урок відкривається лише після позначки про попередній.
        teacher:
          oneOf:
            - $ref: '#/components/schemas/TeacherProfile'
