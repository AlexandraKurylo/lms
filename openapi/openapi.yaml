openapi: 3.1.0
info:
  title: LMS API
  version: 1.0.0
  summary: API платформи онлайн-курсів
  description: |
    REST API платформи онлайн-курсів (LMS): каталог курсів, потоки з обмеженою кількістю місць,
    уроки, прогрес, домашні роботи.

    **Автентифікація.** Після входу сервер ставить httpOnly-cookie `lms_session`; усі захищені
    операції позначені `cookieAuth`.

    **Помилки.** Усі помилки повертаються у форматі `application/problem+json` (RFC 9457)
    зі стабільним полем `type`. Перелік типів — у схемі `Problem`.

    **Наскрізний ідентифікатор.** Кожна відповідь має заголовок `X-Request-Id`; його ж містять
    рядки логів сервера й поле `requestId` у problem+json.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
    description: Той самий хост, що й вебзастосунок (проксі в Vite і nginx)
tags:
  - name: System
    description: Службові ендпоінти для моніторингу
  - name: Auth
    description: Реєстрація, вхід і сесія
  - name: Teacher
    description: Кабінет викладача (лише teacher і admin)
  - name: Admin
    description: Дії адміністратора (лише admin)
  - name: Catalog
    description: Публічний каталог курсів (доступний гостям)
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Перевірка життєздатності
      description: Повертає `ok`, поки процес живий. Не звертається до бази даних.
      security: []
      responses:
        '200':
          description: Процес працює
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
  /ready:
    get:
      tags:
        - System
      operationId: getReady
      summary: Перевірка готовності
      description: Повертає `ready`, якщо доступна база даних. Використовується оркестратором і Docker healthcheck.
      security: []
      responses:
        '200':
          description: Сервіс готовий приймати запити
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: Реєстрація студента
      description: Створює обліковий запис із роллю `student` і одразу входить (ставить cookie `lms_session` і `lms_refresh`). Викладачів призначає адміністратор.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Обліковий запис створено
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Вхід
      description: Перевіряє пошту й пароль і ставить httpOnly-cookie `lms_session` (15 хвилин) та `lms_refresh` (7 днів). Refresh-токена в тілі відповіді немає. Відповідь однакова для «немає такої пошти» і «хибний пароль».
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Вхід виконано
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Вихід
      description: Відкликає refresh-токени цього входу й видаляє cookie. Безпечно викликати повторно.
      security: []
      responses:
        '204':
          description: Сесію завершено
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshSession
      summary: Оновлення сесії
      description: |
        Обмінює refresh-токен із cookie `lms_refresh` на нову пару cookie. Кожен refresh-токен
        дійсний рівно один раз. Якщо старий токен пред'явлено повторно, відкликається все
        сімейство токенів цього входу (ознака крадіжки), і користувач має увійти заново.
        Відповідь на будь-яку проблему з токеном однакова.
      security: []
      responses:
        '200':
          description: Сесію оновлено
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout-all:
    post:
      tags:
        - Auth
      operationId: logoutAll
      summary: Вихід з усіх пристроїв
      description: Відкликає всі refresh-токени користувача. Уже виданий короткий `lms_session` діє до закінчення (до 15 хвилин).
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Усі сесії завершено
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      tags:
        - Auth
      operationId: getMe
      summary: Поточний користувач
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Користувач, що увійшов
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /topics:
    get:
      tags:
        - Catalog
      operationId: listTopics
      summary: Теми курсів
      description: Усі теми для фільтра каталогу, за алфавітом.
      security: []
      responses:
        '200':
          description: Список тем
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Topic'
        '500':
          $ref: '#/components/responses/InternalError'
  /teacher/courses:
    get:
      tags:
        - Teacher
      operationId: listOwnCourses
      security:
        - cookieAuth: []
      summary: Мої курси (кабінет викладача)
      description: |
        Викладач бачить лише власні курси, адміністратор — усі. Студент отримує 403.
      responses:
        '200':
          description: Курси
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OwnCourse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Teacher
      operationId: createOwnCourse
      security:
        - cookieAuth: []
      summary: Створити курс
      description: |
        Власником стає користувач із сесії. Поля `teacherId` у тілі немає, а зайві поля дають 400.
        Новий курс — чернетка.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseInput'
      responses:
        '201':
          description: Курс створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnCourse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /teacher/courses/{id}:
    get:
      tags:
        - Teacher
      operationId: getOwnCourse
      security:
        - cookieAuth: []
      summary: Мій курс
      description: Чужий курс повертає 404, так само як неіснуючий (ADR 0013).
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Курс
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnCourse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Teacher
      operationId: updateOwnCourse
      security:
        - cookieAuth: []
      summary: Змінити курс
      description: |
        Частковий запис полів курсу. Статусу тут немає: публікує й знімає курси адміністратор
        (`/admin/courses/{id}/status`). Чужий або неіснуючий курс — 404.
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdate'
      responses:
        '200':
          description: Курс після зміни
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnCourse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /teacher/courses/{id}/lessons:
    post:
      tags:
        - Teacher
      operationId: addOwnLesson
      security:
        - cookieAuth: []
      summary: Додати урок у кінець курсу
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonInput'
      responses:
        '201':
          description: Урок додано
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - position
                properties:
                  id:
                    type: integer
                  position:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/courses/{id}/status:
    patch:
      tags:
        - Admin
      operationId: setCourseStatus
      security:
        - cookieAuth: []
      summary: Опублікувати або зняти курс з публікації
      description: Лише адміністратор. Курс без уроків не публікується (409 `course-incomplete`).
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - draft
                    - published
      responses:
        '200':
          description: Новий статус
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                  - teacherId
                properties:
                  id:
                    type: integer
                  status:
                    type: string
                    enum:
                      - draft
                      - published
                  teacherId:
                    type:
                      - integer
                      - 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Курс не готовий до публікації (`course-incomplete`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/courses/{id}/teacher:
    patch:
      tags:
        - Admin
      operationId: assignCourseTeacher
      security:
        - cookieAuth: []
      summary: Призначити викладача курсу
      description: Лише адміністратор. Призначити можна тільки користувача з роллю teacher.
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - teacherId
              properties:
                teacherId:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Викладача призначено
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - teacherId
                properties:
                  id:
                    type: integer
                  teacherId:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /courses:
    get:
      tags:
        - Catalog
      operationId: listCourses
      summary: Каталог курсів
      description: |
        Опубліковані курси, відсортовані за назвою. Фільтри комбінуються через «і».
        Пагінація курсорна (keyset): передайте `nextCursor` з попередньої відповіді як `cursor`.
        `nextCursor: null` означає останню сторінку.
      security: []
      parameters:
        - name: topic
          in: query
          description: Ідентифікатор теми.
          schema:
            type: integer
            minimum: 1
        - name: level
          in: query
          schema:
            $ref: '#/components/schemas/Level'
        - name: language
          in: query
          description: Двобуквений код мови курсу.
          schema:
            type: string
            pattern: ^[a-z]{2}$
            examples:
              - uk
        - name: q
          in: query
          description: Пошук у назві й описі (без урахування регістру).
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Непрозорий курсор зі значення `nextCursor`.
          schema:
            type: string
      responses:
        '200':
          description: Сторінка каталогу
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /courses/{id}:
    get:
      tags:
        - Catalog
      operationId: getCourse
      summary: Сторінка курсу
      description: |
        Опис курсу, викладач, теми, **зміст** (без тексту уроків) і потоки з обчисленими вільними місцями.
        Чернетку бачать лише адміністратор і викладач-власник; для всіх інших вона повертає 404.
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Курс
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /courses/{id}/intro-lesson:
    get:
      tags:
        - Catalog
      operationId: getIntroLesson
      summary: Безкоштовний вступний урок
      description: Єдиний урок курсу, доступний без запису й без входу. Інші уроки потребують запису на потік.
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Вступний урок
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntroLesson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lms_session
      description: Короткий (15 хвилин) сесійний JWT у httpOnly-cookie, який ставить `POST /auth/login`. Поновлюється через `POST /auth/refresh`.
  headers:
    X-Request-Id:
      description: Наскрізний ідентифікатор запиту (також є в логах і в `requestId` помилок).
      schema:
        type: string
        examples:
          - 3f0c1d6e-8a37-4e0b-9d3e-2a6a1c9b7f10
    Set-Cookie:
      description: Сесійний cookie `lms_session` (HttpOnly; SameSite=Lax; Secure у production; 15 хвилин) і `lms_refresh` (HttpOnly; SameSite=Strict; Path=/api/auth; 7 днів).
      schema:
        type: string
  responses:
    BadRequest:
      description: Некоректний запит або помилка валідації (`validation`, `bad-request`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://lms.example/problems/validation
            title: Помилка валідації
            status: 400
            detail: Дані не пройшли перевірку
            instance: /api/courses
            requestId: 3f0c1d6e-8a37-4e0b-9d3e-2a6a1c9b7f10
            errors:
              - path: query.limit
                message: Number must be less than or equal to 50
    Unauthorized:
      description: Потрібен вхід (`unauthorized`) або невірні облікові дані (`invalid-credentials`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://lms.example/problems/unauthorized
            title: Потрібна автентифікація
            status: 401
            instance: /api/auth/me
            requestId: 3f0c1d6e-8a37-4e0b-9d3e-2a6a1c9b7f10
    Forbidden:
      description: Дію заборонено (`forbidden`, `lesson-locked`, `not-enrolled`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://lms.example/problems/lesson-locked
            title: Урок ще закритий
            status: 403
            detail: Спершу позначте пройденими попередні уроки
            instance: /api/lessons/12
            requestId: 3f0c1d6e-8a37-4e0b-9d3e-2a6a1c9b7f10
    NotFound:
      description: Ресурсу немає або він належить іншому користувачу (`not-found`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://lms.example/problems/not-found
            title: Ресурс не знайдено
            status: 404
            detail: Курс не знайдено
            instance: /api/courses/9999
            requestId: 3f0c1d6e-8a37-4e0b-9d3e-2a6a1c9b7f10
    Conflict:
      description: Запит конфліктує зі станом даних (`email-taken`, `already-enrolled`, `stream-full`, `stream-closed`, `has-later-progress`, `course-in-use`, `course-incomplete`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://lms.example/problems/stream-full
            title: На потоці немає вільних місць
            status: 409
            instance: /api/streams/5/enrollments
            requestId: 3f0c1d6e-8a37-4e0b-9d3e-2a6a1c9b7f10
    PayloadTooLarge:
      description: Перевищено ліміт розміру запиту або файлу (`payload-too-large`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Той самий `Idempotency-Key` використано з іншим запитом (`idempotency-key-reuse`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Забагато спроб; повторіть пізніше (`rate-limited`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Внутрішня помилка сервера (`internal`). Відповідь не містить `detail` і стектрейсу.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Залежність (база даних) недоступна (`service-unavailable`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CourseInput:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        language:
          type: string
          pattern: ^[a-z]{2}$
        level:
          $ref: '#/components/schemas/Level'
        sequentialLessons:
          type: boolean
    CourseUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        language:
          type: string
          pattern: ^[a-z]{2}$
        level:
          $ref: '#/components/schemas/Level'
        sequentialLessons:
          type: boolean
    LessonInput:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        content:
          type: string
          maxLength: 50000
        isFreeIntro:
          type: boolean
        hasHomework:
          type: boolean
    OwnCourse:
      type: object
      required:
        - id
        - title
        - description
        - language
        - level
        - status
        - sequentialLessons
        - teacherId
        - lessonCount
        - updatedAt
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        language:
          type: string
        level:
          $ref: '#/components/schemas/Level'
        status:
          type: string
          enum:
            - draft
            - published
        sequentialLessons:
          type: boolean
        teacherId:
          type:
            - integer
            - 'null'
        lessonCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    Ready:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ready
    FieldError:
      type: object
      required:
        - path
        - message
      properties:
        path:
          type: string
          description: Шлях до поля, наприклад `body.email` або `query.limit`.
          examples:
            - body.email
        message:
          type: string
    Problem:
      type: object
      description: Помилка за RFC 9457 (`application/problem+json`).
      required:
        - type
        - title
        - status
        - instance
        - requestId
      properties:
        type:
          type: string
          description: Стабільний ідентифікатор класу помилки. Клієнт перемикається за ним, а не за текстом.
          enum:
            - https://lms.example/problems/bad-request
            - https://lms.example/problems/validation
            - https://lms.example/problems/unauthorized
            - https://lms.example/problems/invalid-credentials
            - https://lms.example/problems/forbidden
            - https://lms.example/problems/lesson-locked
            - https://lms.example/problems/not-enrolled
            - https://lms.example/problems/not-found
            - https://lms.example/problems/email-taken
            - https://lms.example/problems/already-enrolled
            - https://lms.example/problems/stream-full
            - https://lms.example/problems/stream-closed
            - https://lms.example/problems/has-later-progress
            - https://lms.example/problems/course-in-use
            - https://lms.example/problems/course-incomplete
            - https://lms.example/problems/idempotency-key-reuse
            - https://lms.example/problems/payload-too-large
            - https://lms.example/problems/rate-limited
            - https://lms.example/problems/service-unavailable
            - https://lms.example/problems/internal
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Пояснення для людини. Для статусу 500 відсутнє.
        instance:
          type: string
          description: Шлях запиту, у якому сталася помилка.
        requestId:
          type: string
          description: Збігається із заголовком `X-Request-Id` і рядками логу.
        errors:
          type: array
          description: Помилки полів (для `validation`).
          items:
            $ref: '#/components/schemas/FieldError'
    Role:
      type: string
      enum:
        - student
        - teacher
        - admin
    User:
      type: object
      required:
        - id
        - email
        - name
        - role
      properties:
        id:
          type: integer
          examples:
            - 42
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Щонайменше 8 символів, не більше 72 байтів; потрібні літера та цифра.
        name:
          type: string
          minLength: 2
          maxLength: 100
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    Level:
      type: string
      enum:
        - beginner
        - intermediate
        - advanced
    Topic:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
    TeacherRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
    CourseSummary:
      type: object
      required:
        - id
        - title
        - description
        - level
        - language
        - teacher
        - topics
        - lessonCount
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        level:
          $ref: '#/components/schemas/Level'
        language:
          type: string
          examples:
            - uk
        teacher:
          oneOf:
            - $ref: '#/components/schemas/TeacherRef'
            - type: 'null'
        topics:
          type: array
          items:
            type: string
        lessonCount:
          type: integer
          minimum: 0
    CourseList:
      type: object
      required:
        - items
        - nextCursor
