      description: Непроверені роботи йдуть від найстаріших, решта від найновіших. Не більше 500 записів.
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - pending
              - graded
            default: all
      responses:
        '200':
          description: Роботи потоку
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StreamSubmission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /teacher/submissions/{id}/grade:
    put:
      tags:
        - Teacher
      operationId: gradeSubmission
      security:
        - cookieAuth: []
      summary: Оцінити домашню роботу
      description: Оцінка від 0 до 100 і необовязковий коментар. Повторне оцінювання замінює попереднє. Робота чужого курсу повертає 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeRequest'
      responses:
        '200':
          description: Оцінена робота
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamSubmission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/enrollments:
    get:
      tags:
        - Enrollments
      operationId: listMyEnrollments
      security:
        - cookieAuth: []
      summary: Мої записи
      responses:
        '200':
          description: Записи поточного студента, нові першими
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyEnrollment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/enrollments/{id}:
    delete:
      tags:
        - Enrollments
      operationId: cancelMyEnrollment
      security:
        - cookieAuth: []
      summary: Скасувати свій запис
      description: Звільняє місце. Чужий, неіснуючий або вже скасований запис — 404.
      parameters:
        - name: id
          in: path
          required: true
          description: Ідентифікатор запису.
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Запис скасовано
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lms_session
      description: Короткий (15 хвилин) сесійний JWT у httpOnly-cookie, який ставить `POST /auth/login`. Поновлюється через `POST /auth/refresh`.
  headers:
    X-Request-Id:
      description: Наскрізний ідентифікатор запиту (також є в логах і в `requestId` помилок).
      schema:
        type: string
        examples:
          - 3f0c1d6e-8a37-4e0b-9d3e-2a6a1c9b7f10
    Idempotency-Replayed:
      description: Дорівнює `true`, якщо відповідь відтворено за збереженим `Idempotency-Key`, а дію не виконано повторно.
      schema:
        type: string
        enum:
          - 'true'
    Set-Cookie:
      description: Сесійний cookie `lms_session` (HttpOnly; SameSite=Lax; Secure у production; 15 хвилин) і `lms_refresh` (HttpOnly; SameSite=Strict; Path=/api/auth; 7 днів).
      schema:
        type: string
  responses:
    BadRequest:
      description: Некоректний запит або помилка валідації (`validation`, `bad-request`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://lms.example/problems/validation
            title: Помилка валідації
            status: 400
            detail: Дані не пройшли перевірку
            instance: /api/courses
            requestId: 3f0c1d6e-8a37-4e0b-9d3e-2a6a1c9b7f10
            errors:
              - path: query.limit
                message: Number must be less than or equal to 50
    Unauthorized:
      description: Потрібен вхід (`unauthorized`) або невірні облікові дані (`invalid-credentials`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://lms.example/problems/unauthorized
            title: Потрібна автентифікація
            status: 401
            instance: /api/auth/me
            requestId: 3f0c1d6e-8a37-4e0b-9d3e-2a6a1c9b7f10
    Forbidden:
      description: Дію заборонено (`forbidden`, `lesson-locked`, `not-enrolled`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://lms.example/problems/lesson-locked
            title: Урок ще закритий
            status: 403
            detail: Спершу позначте пройденими попередні уроки
            instance: /api/lessons/12
            requestId: 3f0c1d6e-8a37-4e0b-9d3e-2a6a1c9b7f10
    NotFound:
      description: Ресурсу немає або він належить іншому користувачу (`not-found`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://lms.example/problems/not-found
            title: Ресурс не знайдено
            status: 404
            detail: Курс не знайдено
            instance: /api/courses/9999
            requestId: 3f0c1d6e-8a37-4e0b-9d3e-2a6a1c9b7f10
    Conflict:
      description: Запит конфліктує зі станом даних (`email-taken`, `already-enrolled`, `stream-full`, `stream-closed`, `has-later-progress`, `submission-graded`, `course-in-use`, `course-incomplete`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://lms.example/problems/stream-full
            title: На потоці немає вільних місць
            status: 409
            instance: /api/streams/5/enrollments
            requestId: 3f0c1d6e-8a37-4e0b-9d3e-2a6a1c9b7f10
    PayloadTooLarge:
      description: Перевищено ліміт розміру запиту або файлу (`payload-too-large`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Той самий `Idempotency-Key` використано з іншим запитом (`idempotency-key-reuse`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Забагато спроб; повторіть пізніше (`rate-limited`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Внутрішня помилка сервера (`internal`). Відповідь не містить `detail` і стектрейсу.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Залежність (база даних) недоступна (`service-unavailable`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CourseInput:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        language:
          type: string
          pattern: ^[a-z]{2}$
        level:
          $ref: '#/components/schemas/Level'
        sequentialLessons:
          type: boolean
    CourseUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        language:
          type: string
          pattern: ^[a-z]{2}$
        level:
          $ref: '#/components/schemas/Level'
        sequentialLessons:
          type: boolean
    LessonInput:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        content:
          type: string
          maxLength: 50000
        isFreeIntro:
          type: boolean
        hasHomework:
          type: boolean
    LessonUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        content:
          type: string
          maxLength: 50000
        isFreeIntro:
          type: boolean
        hasHomework:
          type: boolean
    OwnLesson:
      type: object
      required:
        - id
        - courseId
        - courseTitle
        - position
        - title
        - content
        - isFreeIntro
        - hasHomework
      properties:
        id:
          type: integer
        courseId:
          type: integer
        courseTitle:
          type: string
        position:
          type: integer
        title:
          type: string
        content:
          type: string
        isFreeIntro:
          type: boolean
        hasHomework:
          type: boolean
    OwnCourse:
      type: object
      required:
        - id
        - title
        - description
        - language
        - level
        - status
        - sequentialLessons
        - teacherId
        - lessonCount
        - updatedAt
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        language:
          type: string
        level:
          $ref: '#/components/schemas/Level'
        status:
          type: string
          enum:
            - draft
            - published
        sequentialLessons:
          type: boolean
        teacherId:
          type:
            - integer
            - 'null'
        lessonCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    Ready:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ready
    FieldError:
      type: object
      required:
        - path
        - message
      properties:
        path:
          type: string
          description: Шлях до поля, наприклад `body.email` або `query.limit`.
          examples:
            - body.email
        message:
          type: string
    Problem:
      type: object
      description: Помилка за RFC 9457 (`application/problem+json`).
      required:
        - type
        - title
        - status
        - instance
        - requestId
      properties:
        type:
          type: string
          description: Стабільний ідентифікатор класу помилки. Клієнт перемикається за ним, а не за текстом.
          enum:
            - https://lms.example/problems/bad-request
            - https://lms.example/problems/validation
            - https://lms.example/problems/unauthorized
            - https://lms.example/problems/invalid-credentials
            - https://lms.example/problems/forbidden
            - https://lms.example/problems/lesson-locked
            - https://lms.example/problems/not-enrolled
            - https://lms.example/problems/stream-not-started
            - https://lms.example/problems/not-found
            - https://lms.example/problems/email-taken
            - https://lms.example/problems/already-enrolled
            - https://lms.example/problems/stream-full
            - https://lms.example/problems/stream-closed
            - https://lms.example/problems/has-later-progress
            - https://lms.example/problems/submission-graded
            - https://lms.example/problems/course-in-use
            - https://lms.example/problems/course-incomplete
            - https://lms.example/problems/idempotency-key-reuse
            - https://lms.example/problems/payload-too-large
            - https://lms.example/problems/rate-limited
            - https://lms.example/problems/service-unavailable
            - https://lms.example/problems/internal
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Пояснення для людини. Для статусу 500 відсутнє.
        instance:
          type: string
          description: Шлях запиту, у якому сталася помилка.
        requestId:
          type: string
          description: Збігається із заголовком `X-Request-Id` і рядками логу.
        errors:
          type: array
          description: Помилки полів (для `validation`).
          items:
            $ref: '#/components/schemas/FieldError'
    Role:
      type: string
