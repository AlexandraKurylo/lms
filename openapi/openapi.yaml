      summary: Записатися на потік
      description: |
        Лише студент. Виконується в одній транзакції з блокуванням рядка потоку (`FOR UPDATE`, ADR 0004):
        при одночасних запитах на останнє місце рівно один отримає 201, решта — 409 `stream-full`.
